.wrap{max-width:1240px;margin-inline:auto;padding-inline:var(--gutter)}

.back{display:inline-flex;align-items:center;gap:.6em;font-size:.95rem;font-weight:500;text-decoration:none;color:var(--fg)}
.back .ico{transform:scaleX(-1)}

.back:hover{color:var(--gold)}
.brand{display:grid;justify-items:center;gap:5px;text-decoration:none;line-height:1;position:absolute;inset-inline:0;margin-inline:auto;width:max-content}

.brand span{font-size:.62rem;font-weight:500;letter-spacing:.5em;margin-inline-end:-.5em;text-transform:uppercase;color:var(--gold)}
html[lang="ar"] .brand b{font-family:var(--f-display);letter-spacing:0;margin:0;font-weight:700}
html[lang="ar"] .brand span{letter-spacing:0;margin:0;font-size:.8rem}
.bar__r{display:flex;align-items:center;gap:8px}
.round{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--fg);cursor:pointer;font:600 .9rem/1 var(--f-body);text-decoration:none;transition:background .25s,color .25s,border-color .25s}
.round:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.round .ico{width:20px;height:20px;stroke-width:1.7}

/* the page heading is for search engines and screen readers only; the list speaks for itself on screen */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* jump links */
.jump{position:sticky;top:0;z-index:20;background:rgba(237,219,200,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-block:1px solid var(--line)}
.jump ul{list-style:none;margin:0;padding:16px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.jump ul::-webkit-scrollbar{display:none}
.jump a{flex:none;display:inline-flex;align-items:center;gap:.5em;padding:9px 16px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:.9rem;font-weight:500;white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
.jump a:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.jump a i{font-style:normal;color:var(--gold);font-size:.78rem;font-weight:600;letter-spacing:.06em}
.jump a:hover i{color:inherit}

.menu{padding-block:clamp(28px,4vw,56px) clamp(80px,10vw,140px);display:grid;gap:clamp(44px,6vw,86px)}
.group{scroll-margin-top:84px;display:grid;gap:clamp(18px,2.4vw,30px)}
.group__head{display:flex;align-items:baseline;gap:clamp(12px,1.6vw,22px);padding-bottom:14px;border-bottom:1px solid var(--line)}
.group__num{font-family:var(--f-display);font-size:clamp(1rem,.8rem + .7vw,1.3rem);font-weight:500;color:var(--gold);letter-spacing:.08em;flex:none}

.svcs{list-style:none;margin:0;padding:0;display:grid;gap:0}
.svc{display:grid;grid-template-columns:1fr auto;gap:4px clamp(18px,3vw,56px);align-items:baseline;padding-block:clamp(18px,2.2vw,26px);border-bottom:1px solid var(--line)}
.svc:last-child{border-bottom:0}
.svc h3{grid-column:1;font-size:clamp(1.15rem,1rem + .5vw,1.45rem);font-weight:500}
.svc__meta{grid-column:2;grid-row:1;display:flex;align-items:baseline;gap:clamp(10px,1.4vw,20px);white-space:nowrap;text-align:end}
.svc__dur{color:var(--muted);font-size:.9rem}

      footDm: "راسله على إنستغرام", footCopy: "© 2026 بلال علي. جميع الحقوق محفوظة.",
      lang: "English", bookAria: "احجز موعداً"
    }
  };

  var $ = function (s) { return document.querySelector(s); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var hasWa = /^\d{8,15}$/.test(CONFIG.whatsapp);
  var lang = "en";
  function t(k) { return T[lang][k] || T.en[k] || k; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* ---------- the menu itself ---------- */
  function render() {
    var menu = $("#menu"), jump = $("#jump");
    menu.textContent = ""; jump.textContent = "";

    CONFIG.groups.forEach(function (g, gi) {
      var num = pad(gi + 1);

      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "#g-" + g.id;
      a.innerHTML = '<i></i><span></span>';
      a.querySelector("i").textContent = num;
      a.querySelector("span").textContent = g[lang];
      li.appendChild(a); jump.appendChild(li);

      var sec = document.createElement("section");
      sec.className = "group"; sec.id = "g-" + g.id;
      sec.setAttribute("aria-labelledby", "h-" + g.id);
      sec.innerHTML = '<div class="group__head"><span class="group__num"></span>' +
        '<h2 id="h-' + g.id + '"></h2></div><ul class="svcs"></ul>';
      sec.querySelector(".group__num").textContent = num;
      sec.querySelector("h2").textContent = g[lang];

      var list = sec.querySelector(".svcs");
      g.items.forEach(function (it) {
        var row = document.createElement("li");
        row.className = "svc";
        row.innerHTML = '<h3></h3><p class="svc__meta"><span class="svc__dur"></span>' +
          '<span class="svc__price"></span></p><p class="svc__desc"></p>';
        row.querySelector("h3").textContent = it[lang][0];
        row.querySelector(".svc__dur").textContent = it[lang][1];
        row.querySelector(".svc__price").textContent = it.price;
        row.querySelector(".svc__desc").textContent = it[lang][2];
        list.appendChild(row);
      });
      menu.appendChild(sec);
    });
  }

  /* ---------- structured data, built from the same list so the two never drift ---------- */
  function schema() {
    var offers = [];
    CONFIG.groups.forEach(function (g) {
      g.items.forEach(function (it) {
        offers.push({
          "@type": "Offer",
          "itemOffered": { "@type": "Service", "name": it.en[0], "description": it.en[2], "category": g.en },
          "priceCurrency": "USD",
          "price": it.price.replace(/[^0-9.\-–]/g, "").split(/[-–]/)[0]
        });
      });
    });
    var el = document.getElementById("ld") || document.createElement("script");
    el.id = "ld"; el.type = "application/ld+json";
    el.textContent = JSON.stringify({
      "@context": "https://schema.org", "@type": "HairSalon",
      "name": "Bilal Ali Salon",
      "url": "https://eliesaide1.github.io/bilalali/services.html",
      "image": "https://eliesaide1.github.io/bilalali/media/services.jpg",
      "telephone": "+9613850966",
      "address": { "@type": "PostalAddress", "streetAddress": "Verdun Street, 732 Building", "addressCountry": "LB" },
      "hasOfferCatalog": { "@type": "OfferCatalog", "name": "Services", "itemListElement": offers }
    });
    if (!el.parentNode) document.head.appendChild(el);
  }

  /* ---------- language ---------- */
  function applyLang(l) {
    lang = l; store.set("lang", l);
    document.documentElement.lang = l;
    document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i]").forEach(function (e) { e.textContent = t(e.dataset.i); });
    document.querySelectorAll("[data-i-html]").forEach(function (e) { e.innerHTML = t(e.dataset.iHtml); });
    var b = $("#lang");
    b.textContent = l === "ar" ? "EN" : "ع";
    b.lang = l === "ar" ? "en" : "ar";
    b.setAttribute("aria-label", t("lang"));
    $("#book-icon").setAttribute("aria-label", t("bookAria"));
    if (hasWa) {
      var fp = $("#foot-phone");
      fp.href = "tel:+" + CONFIG.whatsapp; fp.textContent = "+" + CONFIG.whatsapp; fp.hidden = false;
    }
    if (CONFIG.address) $("#f-address").textContent = CONFIG.address[l] || CONFIG.address.en;
    document.title = (l === "ar" ? "الخدمات والأسعار" : "Services & Prices") + " · Bilal Ali Salon";
    render();
  }
  $("#lang").addEventListener("click", function () { applyLang(lang === "ar" ? "en" : "ar"); });
  applyLang(store.get("lang") === "ar" ? "ar" : "en");
  schema();
})();
</script>
</body>
</html>
