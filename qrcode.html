@font-face{font-family:"Blauer Nue";src:url("media/fonts/blauer-nue-300.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Blauer Nue";src:url("media/fonts/blauer-nue-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Blauer Nue";src:url("media/fonts/blauer-nue-500.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
:root{
  --bg:#EDDBC8;--surface:#F6EBDD;--fg:#1E1710;--muted:#6B5A48;--line:rgba(30,23,16,.18);--gold:#8B6630;
  --f:"Blauer Nue","Hanken Grotesk",system-ui,sans-serif;
  --gutter:clamp(16px,4.5vw,56px);color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2{font-family:var(--f);font-weight:500;letter-spacing:-.012em;margin:0}

.wrap{max-width:1000px;margin-inline:auto;padding:clamp(28px,5vw,64px) var(--gutter) clamp(48px,7vw,88px)}

/* brand mark, small: this page is a utility, not a landing page */
.brand{display:grid;justify-items:center;gap:5px;margin-bottom:clamp(28px,4vw,48px);line-height:1}
.brand b{font-weight:400;font-size:1.5rem;letter-spacing:.2em;margin-inline-end:-.2em;text-transform:uppercase}
.brand span{font-size:.6rem;font-weight:500;letter-spacing:.5em;margin-inline-end:-.5em;text-transform:uppercase;color:var(--gold)}

.codes{display:grid;gap:clamp(20px,3vw,32px);grid-template-columns:1fr}
@media (min-width:760px){.codes{grid-template-columns:repeat(2,1fr)}}

.code{display:grid;justify-items:center;gap:18px;padding:clamp(22px,3vw,34px);
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  transition:border-color .25s,transform .25s}
.code:hover{border-color:var(--gold);transform:translateY(-2px)}
/* white plate behind the code: scanners cope badly with a tinted background */
.code__qr{width:min(300px,100%);aspect-ratio:1;padding:14px;background:#fff;border-radius:12px}
.code__qr svg{display:block;width:100%;height:100%}
.code h2{font-size:clamp(1.15rem,1rem + .4vw,1.4rem)}
.code__ar{font-size:1.05rem;color:var(--muted);margin:-10px 0 0}
.code__url{font-size:.8rem;color:var(--muted);word-break:break-all;text-align:center;margin:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* printing gives a clean pair of codes to cut out and stand on the counter */
@media print{
  body{background:#fff}
  .wrap{padding:0}
  .code{border-color:#ccc;background:#fff;break-inside:avoid}
  .code:hover{transform:none}
  .codes{grid-template-columns:repeat(2,1fr)}
  .code__url{display:none}
}
</style>
